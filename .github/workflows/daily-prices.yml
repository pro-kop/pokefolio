name: Denní ceny

on:
  schedule:
    # 04:15 UTC = 06:15 v létě, 05:15 v zimě. Cardmarket generuje ceník kolem 01:00 UTC.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stáhnout ceny a připsat do historie
        run: node scripts/fetch-prices.mjs

      - name: Přepočítat radar
        run: node scripts/compute-radar.mjs

      - name: Commitnout data
        id: commit
        run: |
          git config user.name "pokefolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Žádná změna dat."
          else
            git commit -m "data: ceny $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ohlásit selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Denní dávka selhala (${new Date().toISOString().slice(0,10)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'etl'
            });
            if (existing.data.length) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['etl'],
              body: [
                'Dávka na stažení cen z Cardmarketu spadla.',
                '',
                `Log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Nejčastější příčina je změna formátu zdrojových souborů.',
                'Zkontroluj `scripts/lib/sources.mjs`.',
                '',
                '**Historii za dnešek už nepůjde doplnit zpětně** — čím dřív se to spraví, tím menší díra.'
              ].join('\n')
            });

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
